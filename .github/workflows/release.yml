name: Build and publish pfQuest-CoA
on:
  push:
    branches: [main]
    paths: ['.release.json', 'tools/**', 'tests/**', 'README.md', 'CHANGELOG.md', 'RELEASE-NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pfquest-coa-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
      - name: Build from checksummed source and validate Lua/TOCs/ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open(".release.json"))["version"])')"
          PRERELEASE="$(python3 -c 'import json; print(str(json.load(open(".release.json"))["prerelease"]).lower())')"
          python3 tools/build_pfquest_release.py
          find build/staging/pfQuest build/staging/pfQuest-ascension -type f -name '*.lua' -print0 | xargs -0 -r -n1 luac5.1 -p
          lua5.1 tests/pfquest_coasync_test.lua build/staging/pfQuest/coa_sync.lua
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "ASSET=dist/pfQuest-CoA-$VERSION.zip" >> "$GITHUB_ENV"
      - name: Publish release and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber
            gh release edit "$VERSION" --title "pfQuest-CoA $VERSION" --notes-file RELEASE-NOTES.md
          else
            args=("$VERSION" "$ASSET" --target "$GITHUB_SHA" --title "pfQuest-CoA $VERSION" --notes-file RELEASE-NOTES.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
            gh release create "${args[@]}"
          fi
